<style>

#gate h1{font-size:2.4rem}#gate form{display:flex;flex-direction:column;gap:10px}#gate input{width:100%;font-size:16px}#gErr{color:var(--shift);min-height:1.2em;margin:0;font-size:.9rem}
/* Layout: one-column phone timeline. Time rail on the left, soft blocks sized by duration, bottom sheet for logging. */
:root{
  --bg:#f6f4f2; --surface:#ffffff; --fg:#2c3138; --muted:#7a7f86; --line:#e4e0dc;
  --accent:#6f8695; --accent-ink:#ffffff;

  --play:#f3e4e2; --play-edge:#d4aaa5;

  --wind:#e7e3ef; --wind-edge:#ada4c4;
  --night:#dde0e8; --night-edge:#8d95ab;
  --shift:#b0705f; --ok:#5f8a6e;
  --display:"Newsreader", Georgia, "Times New Roman", serif;
  --body:"Figtree", -apple-system, "Segoe UI", Roboto, sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#1b1d21; --surface:#25282d; --fg:#e8e6e3; --muted:#9a9ea5; --line:#353940;
  --accent:#9fb6c4; --accent-ink:#16181b;
  --feed:#2b3439; --feed-edge:#6d8796; --play:#3a2f2f; --play-edge:#a07a75;
  --nap:#35312b; --nap-edge:#93836c; --wind:#312e3a; --wind-edge:#8379a0;
  --night:#2a2d36; --night-edge:#6e7690; --shift:#de9a87; --ok:#8fbb9c; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#1b1d21; --surface:#25282d; --fg:#e8e6e3; --muted:#9a9ea5; --line:#353940;
  --accent:#9fb6c4; --accent-ink:#16181b;
  --feed:#2b3439; --feed-edge:#6d8796; --play:#3a2f2f; --play-edge:#a07a75;
  --nap:#35312b; --nap-edge:#93836c; --wind:#312e3a; --wind-edge:#8379a0;
  --night:#2a2d36; --night-edge:#6e7690; --shift:#de9a87; --ok:#8fbb9c; color-scheme:dark }
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 96px}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
header{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{font-family:var(--display);font-weight:500;font-size:2rem;line-height:1.1;margin:0;text-wrap:balance}
.age{color:var(--muted);font-size:.95rem}
.stage-pill{font-size:.75rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:4px 10px;white-space:nowrap}
.tabs{display:flex;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:4px}
.tabs button{flex:1;border:0;background:transparent;color:var(--muted);font:600 .9rem var(--body);padding:8px;border-radius:9px;cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--accent);color:var(--accent-ink)}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.day{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:6px 0;text-align:center;cursor:pointer;color:var(--fg);font-family:var(--body)}
.day small{display:block;font-size:.68rem;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.day b{font-family:var(--display);font-weight:500;font-size:1.15rem}
.day[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.day[aria-pressed="true"] small{color:var(--accent-ink);opacity:.85}
.toolbar{display:flex;flex-direction:column;gap:6px;font-size:.88rem;color:var(--muted)}
.toolbar .r{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.switch{display:flex;align-items:center;gap:8px;cursor:pointer}
.switch input{width:18px;height:18px;accent-color:var(--accent)}
.preview{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:.88rem;color:var(--muted)}
.preview b{color:var(--fg)}
details.tips{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
details.tips summary{cursor:pointer;font-weight:600;font-size:.9rem}
details.tips ul{margin:8px 0 2px;padding-left:18px;display:flex;flex-direction:column;gap:6px;font-size:.88rem;color:var(--muted)}
.tl{position:relative;display:grid;grid-template-columns:62px minmax(0,1fr);column-gap:10px}
.tlabel{font-variant-numeric:tabular-nums;font-size:.78rem;color:var(--muted);padding-top:10px;text-align:right;white-space:nowrap}
.block{position:relative;border-radius:14px;padding:10px 12px 10px 16px;margin-bottom:6px;cursor:pointer;border:0;text-align:left;width:100%;
  font-family:var(--body);color:var(--fg);display:flex;flex-direction:column;gap:2px;overflow:hidden}
.block::before{content:"";position:absolute;left:7px;top:10px;bottom:10px;width:3px;border-radius:2px;background:var(--edge)}
.block:focus-visible,.day:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.b-feed{background:var(--feed);--edge:var(--feed-edge)} .b-play,.b-bath{background:var(--play);--edge:var(--play-edge)}
.b-nap{background:var(--nap);--edge:var(--nap-edge)} .b-wind{background:var(--wind);--edge:var(--wind-edge)} .b-night{background:var(--night);--edge:var(--night-edge)}
.b-special{background:var(--surface);box-shadow:inset 0 0 0 1px var(--line);--edge:var(--line)}
.b-grace{background:transparent;box-shadow:inset 0 0 0 1px var(--line);--edge:transparent}
.b-grace .name{font-size:1.1rem;color:var(--muted)}
.block .row{display:flex;align-items:baseline;justify-content:space-between;gap:8px;flex-wrap:wrap}
.block .name{font-family:var(--display);font-size:1.3rem;font-weight:500;line-height:1.2}
.block .range{font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.block .timer{color:var(--fg);font-weight:600;font-size:1rem}
.block .note{font-size:.82rem;color:var(--muted)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:2px}
.chip{font-size:.72rem;font-weight:600;border-radius:999px;padding:2px 8px;background:var(--surface);color:var(--muted);font-variant-numeric:tabular-nums}
.b-special .chip{background:var(--bg)}
.chip.late{color:var(--shift)} .chip.done{color:var(--ok)} .chip.live{background:var(--fg);color:var(--bg)}
.block.past{opacity:.62} .block.skipped .name,.block.skipped .range,.block.skipped .note:not(.un),.block.skipped .chip{opacity:.4} .block.skipped .name{text-decoration:line-through} .block.skipped .note.un{color:var(--fg);font-size:.9rem}
.nowline{position:absolute;left:0;right:0;height:0;border-top:2px solid var(--fg);z-index:2;pointer-events:none}
.nowline span{position:absolute;left:0;top:-11px;background:var(--fg);color:var(--bg);font-size:.7rem;font-weight:600;border-radius:999px;padding:2px 7px;font-variant-numeric:tabular-nums}
.sheet-bg{position:fixed;inset:0;background:rgba(20,22,26,.35);z-index:20}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;background:var(--surface);border-radius:18px 18px 0 0;
  padding:18px max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));
  display:flex;flex-direction:column;gap:12px;max-width:560px;margin:0 auto;box-shadow:0 -6px 24px rgba(0,0,0,.12)}
.sheet h2{font-family:var(--display);font-weight:500;font-size:1.5rem;margin:0}
.sheet p{margin:0;color:var(--muted);font-size:.88rem}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--fg);font:600 .95rem var(--body);border-radius:12px;padding:12px 14px;cursor:pointer}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent}
.btnrow{display:flex;gap:8px;flex-wrap:wrap} .btnrow>*{flex:1 1 120px}
input[type=time],input[type=date],input[type=number],input[type=text],select{font:500 .95rem var(--body);color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 10px;min-width:0}
.ed{display:flex;flex-direction:column;gap:14px}
.ed .card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px}
.ed label{font-size:.75rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);display:flex;flex-direction:column;gap:4px}
.ed label.switch{flex-direction:row;align-items:center;font-size:.88rem;letter-spacing:0;text-transform:none}
.tfull{width:100%;text-align:center;font-size:1.05rem}.auto{margin:0;font-size:.88rem;color:var(--fg);min-height:1.2em}.auto:empty{display:none}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}.grid2 input,.grid2 select{width:100%}
.erow{display:grid;grid-template-columns:minmax(0,1fr) 96px 64px auto;gap:6px;align-items:center;padding-bottom:10px;border-bottom:1px solid var(--line)}
.erow .del{border:0;background:transparent;color:var(--muted);font-size:1.1rem;cursor:pointer;padding:6px}
.ehead{font-size:.7rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);border:0;padding:0}
.erow input[type=text]{width:100%}
.etime{font-size:.75rem;color:var(--muted);font-variant-numeric:tabular-nums;grid-column:1/-1}
.efix{grid-column:1/-1;display:flex;align-items:center;gap:8px;font-size:.8rem;color:var(--muted)}
.hint{font-size:.85rem;color:var(--muted);margin:0}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:8px 14px;border-radius:999px;font-size:.85rem;z-index:30}
.quick{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.qb{display:flex;flex-direction:column;align-items:center;gap:6px;background:none;border:0;cursor:pointer;color:var(--fg);font:500 .78rem var(--body);padding:0}
.qb span{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;color:var(--fg)}
.loglist{display:flex;flex-direction:column;gap:8px}
.ev{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;align-items:start;text-align:left;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;cursor:pointer;color:var(--fg);font-family:var(--body)}
.ev .dot{width:12px;height:12px;border-radius:50%;background:var(--dot);margin-top:4px}
.evb{display:flex;flex-direction:column;gap:2px;min-width:0}
.evt{font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums}
.evn{font-family:var(--display);font-size:1.2rem;line-height:1.25}
.evx{font-size:.85rem;color:var(--muted)}
.oz{display:grid;grid-template-columns:56px 1fr 56px;gap:10px;align-items:center}
.oz output{text-align:center;font-family:var(--display);font-size:2rem;font-variant-numeric:tabular-nums}
.kinds{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.vd{margin-top:8px;width:100%}
.vd[aria-pressed="true"]::after{content:" ✓"}
.kind[aria-pressed="true"],.vd[aria-pressed="true"],#ranges button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.lbl{font-size:.75rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);display:flex;flex-direction:column;gap:4px}
#ranges{display:flex;gap:6px} #ranges button{flex:1;padding:9px}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:2px}
.tile small{font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.tile b{font-family:var(--display);font-weight:500;font-size:1.5rem;font-variant-numeric:tabular-nums}
.tile i{font-style:normal;font-size:.8rem;color:var(--muted)}
.chart{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:4px}
.chart h3{margin:0;font-family:var(--display);font-weight:500;font-size:1.15rem}

.chart .bar{fill:var(--accent)} .chart .bar.sel{fill:var(--fg)} .chart .col{cursor:pointer}
.sheet{max-height:88vh;overflow:auto}
.hright{display:flex;align-items:center;gap:8px}
.gear{border:1px solid var(--line);background:var(--surface);color:var(--muted);width:38px;height:38px;border-radius:50%;display:grid;place-items:center;cursor:pointer;padding:0}
.gear[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.next{display:grid;grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"k go" "n go" "s go";column-gap:12px;align-items:center;text-align:left;width:100%;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:12px 14px;cursor:pointer;color:var(--fg);font-family:var(--body)}
.next .nk{grid-area:k;font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.next .nn{grid-area:n;font-family:var(--display);font-size:1.35rem;line-height:1.25}

.ed label.set{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;align-items:start;text-transform:none;letter-spacing:0;font-size:inherit;color:var(--fg);cursor:pointer}
.set input{width:20px;height:20px;margin:2px 0 0;accent-color:var(--accent)}
.set b{font-weight:600;font-size:.95rem}
.set span{grid-column:2;font-size:.85rem;color:var(--muted)}
.ed label.set+label.set{padding-top:12px;border-top:1px solid var(--line)}
.diaper-hint{margin:0;font-size:.85rem;color:var(--muted)}
@media (max-width:380px){ .erow{grid-template-columns:minmax(0,1fr) 84px 56px auto} }

/* ---------- the shifting engine ----------
   Blocks run back to back from the morning start. A block with a fixed clock time ("at") always starts then.
   A block with 0 minutes fills the gap until the next block. A logged start moves everything after it,
   unless it is within the grace period of where it was due. */
function chain(stage,st,sk,durs,grace,endAt,en){en=en||{};
  const bl=stage.blocks,n=bl.length,base=[],disp=[];

    let e;

    else if(en[i-1]!=null&&!sk[i-1])e=en[i-1];
    else e=bl[i-1].d===0&&!sk[i-1]&&st[i]==null?base[i-1]:base[i-1]+durs[i-1];
    if(st[i]!=null){const v=st[i];base[i]=grace&&Math.abs(v-e)<=grace?e:v;disp[i]=v;}
    else{base[i]=e;disp[i]=e;}

  const ends=bl.map((b,i)=>sk[i]?base[i]:en[i]!=null?Math.max(disp[i],en[i]):(b.d===0?(i<n-1?Math.max(base[i],base[i+1]):Math.max(base[i],end)):base[i]+durs[i]));

// index of the first overnight block (fixed time after midnight); everything from there on happens early the same morning
function splitAt(stage){const k=stage.blocks.findIndex(b=>b.at!=null&&b.at>=1440);return k<0?stage.blocks.length:k;}

    const ov=computePart({wake:0,blocks:bl.slice(k).map(b=>{const c=Object.assign({},b);if(c.at!=null)c.at-=1440;return c;})},os,ok,false,grace,stage.wake,oe);

function computePart(stage,st,sk,hold,grace,endAt,en){
  const bl=stage.blocks,n=bl.length;

  const clip=c=>{for(let i=0;i<n-1;i++)if(!sk[i]&&!(en&&en[i]!=null)&&c.ends[i]>c.base[i+1])c.ends[i]=Math.max(c.base[i],c.base[i+1]);return c;};

  const trimmed={};

  if(hold&&bi>0&&st[bi]==null){

}

  });

 nap:'<path d="M5 9h6l-6 8h6M14 5h5l-5 6h5"/>',

  const ds=selDate;evLoaded=false;events=((LS.get("ev:"+ds)||{}).items)||[];evKnown={};events.forEach(e=>{evKnown[e.id]=JSON.stringify(e);});relayEv(ds,events);renderLog();

    evKnown=k;const moved=relayEv(ds,events);if(moved&&!x.metadata.fromCache)saveEvents();cacheEv();renderLog();if(!$("trendsView").hidden)renderTrends();if(!x.metadata.fromCache){evLoaded=true;healStarts();}},()=>{});}

  closeOpenNaps(at);
  if(k){let e=events.find(x=>x.blk===i);if(!e){e={id:newId(),t:k,at,blk:i,lay:2};events.push(e);}e.at=at;if(end!=null&&(k==="nap"||k==="night"))e.end=end;else if(e.end!=null&&e.end<=at)delete e.end;if(k==="bottle"){e.oz=oz;if(vd!=null)applyVd(e,vd);}}
  if(i===0){const pd=prevDs(selDate);(trendDocs[pd]||[]).forEach(x=>{if(x.t==="night"&&x.end==null){x.end=at+1440;patchDay(pd,x);}});}
  saveEvents();render();renderLog();
  return k;
}
// Logging a bottle, nap or night sleep from the Log tab marks the closest matching scheduled block as started.
function linkSchedule(t,at){
  const stage=stageFor(selDate);const r=compute(stage,log,cfg.hold,cfg.grace);const st=log.starts||{},sk=log.skips||{};
  let best=-1,bd=1e9;
  stage.blocks.forEach((b,i)=>{if(st[i]!=null||sk[i]||events.some(x=>x.blk===i))return;
    const ok=t==="bottle"?isBottle(b):t==="nap"?b.t==="nap":(b.t==="night"&&i===r.bi);
    if(!ok)return;const d=Math.abs(r.base[i]-at);if(d<bd){bd=d;best=i;}});
  if(best<0||bd>(t==="night"?180:90))return -1;
  log.starts=st;log.skips=sk;log.starts[best]=at;saveLog();return best;
}
function openEvSheet(t,e){
  const isNew=!e,stage=stageFor(selDate),isToday=selDate===cycleToday();
  const now=isToday?nowIn(stage):stage.wake+180;
  const it=e?JSON.parse(JSON.stringify(e)):{id:newId(),t,at:now,lay:2};
  if(isNew&&t==="bottle")it.oz=lastOz();
  const span=t==="nap"||t==="night";
  let h='<div class="sheet-bg" id="sbg"></div><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sh"><h2 id="sh"></h2>';
  h+='<label class="lbl">'+(span?"Start":"Time")+'<input type="time" id="evAt"></label>';
  if(span)h+='<label class="lbl">End<input type="time" id="evEnd"></label><button class="btn" id="evClr">Still going, clear the end</button>';
  if(span&&isNew&&isToday)h+='<button class="btn" id="evTimer">Start '+EV[t].label.toLowerCase()+' now</button>';
  if(t==="bottle")h+='<div class="oz"><button class="btn" id="ozm" aria-label="Less">−</button><output id="ozv"></output><button class="btn" id="ozp" aria-label="More">+</button></div><button class="btn vd" id="vd">VD</button>';
  if(t==="diaper"&&isNew)h+='<p class="diaper-hint">Tap one to save it.</p>';
  if(t==="diaper")h+='<div class="kinds">'+Object.keys(DIAPER).map(k=>'<button class="btn kind" data-k="'+k+'" aria-pressed="'+(it.kind===k)+'">'+DIAPER[k]+"</button>").join("")+"</div>";
  h+='<input type="text" id="evNote" placeholder="'+(t==="note"?"What happened?":"Note (optional)")+'" aria-label="Note">';
  if(isNew&&(t==="bottle"||span))h+='<label class="switch"><input type="checkbox" id="evLink" checked> Update the schedule to match</label>';
  h+='<div class="btnrow"><button class="btn primary" id="evSave"'+(isNew&&t==="diaper"?" hidden":"")+'>Save</button>'+(isNew?"":'<button class="btn" id="evDel">Delete</button>')+'<button class="btn ghost" id="evCancel">Cancel</button></div></div>';
  $("sheetHost").innerHTML=h;
  $("sh").textContent=(isNew?"Log ":"Edit ")+EV[t].label.toLowerCase();
  $("evNote").value=it.note||"";$("evAt").value=toInput(it.at);
  if(span){$("evEnd").value=it.end!=null?toInput(it.end):"";const sc=()=>{$("evClr").hidden=!$("evEnd").value;};sc();$("evEnd").addEventListener("input",sc);$("evEnd").addEventListener("change",sc);$("evClr").onclick=()=>{$("evEnd").value="";sc();};}
  const showOz=()=>{$("ozv").textContent=(+it.oz||0)+" oz";};
  if(t==="bottle"){showOz();$("ozm").onclick=()=>{it.oz=Math.max(0,(+it.oz||0)-0.25);showOz();};$("ozp").onclick=()=>{it.oz=(+it.oz||0)+0.25;showOz();};}
  let vdOn=!!vdOwner(),vdDirty=false;
  if($("vd")){const sv=()=>$("vd").setAttribute("aria-pressed",vdOn);sv();$("vd").onclick=()=>{vdOn=!vdOn;vdDirty=true;sv();};}
  document.querySelectorAll(".kind").forEach(b=>b.onclick=()=>{it.kind=b.dataset.k;document.querySelectorAll(".kind").forEach(x=>x.setAttribute("aria-pressed",x===b));if(isNew)$("evSave").click();});
  const commit=()=>{
    let msg="Saved";
    if(isNew&&(t==="bottle"||t==="nap"))closeOpenNaps(it.at);
    if(isNew&&$("evLink")&&$("evLink").checked){const bi=linkSchedule(t,it.at);if(bi>=0){it.blk=bi;msg="Saved, and the schedule moved to match";}}
    if(!isNew&&it.blk!=null&&(it.at!==e.at||it.end!==e.end)){log.starts=log.starts||{};log.ends=log.ends||{};log.starts[it.blk]=it.at;if(span&&it.end!=null)log.ends[it.blk]=it.end;else delete log.ends[it.blk];saveLog();}
    const k=events.findIndex(x=>x.id===it.id);if(k<0)events.push(it);else events[k]=it;
    if(t==="bottle"&&vdDirty)applyVd(it,vdOn);
    saveEvents();closeSheet();render();renderLog();toast(msg);
  };
  if($("evTimer"))$("evTimer").onclick=()=>{it.at=nowIn(stage);delete it.end;it.note=$("evNote").value.trim();commit();};
  $("evSave").onclick=()=>{
    const m=fromInput($("evAt").value);if(m!=null)it.at=m;
    if(span){const em=fromInput($("evEnd").value);if(em!=null){let x=em;if(x<it.at){if(t==="night"||it.at-x>720)x+=1440;else{toast("The end time is before the start");return;}}it.end=x;}else delete it.end;}
    it.note=$("evNote").value.trim();
    if(t==="note"&&!it.note){toast("Type a note first");return;}
    if(t==="diaper"&&!it.kind){toast("Pick pee, poo, mixed or dry");return;}
    commit();
  };
  if($("evDel"))$("evDel").onclick=()=>{events=events.filter(x=>x.id!==it.id);if(it.blk!=null&&log.starts){delete log.starts[it.blk];saveLog();}saveEvents();closeSheet();render();renderLog();toast("Deleted");};
  $("evCancel").onclick=closeSheet;$("sbg").onclick=closeSheet;
}

/* ---------- trends ---------- */
function dayStats(items){
  const s={oz:0,bottles:0,nap:0,night:0,diapers:0,wet:0,dirty:0,any:items.length>0};
  items.forEach(e=>{
    if(e.t==="bottle"){s.oz+=+e.oz||0;s.bottles++;}
    else if(e.t==="diaper"){s.diapers++;if(e.kind==="pee"||e.kind==="mixed")s.wet++;if(e.kind==="poo"||e.kind==="mixed")s.dirty++;}
    else if(e.t==="nap"&&e.end!=null)s.nap+=e.end-e.at;
    else if(e.t==="night"&&e.end!=null)s.night+=e.end-e.at;
  });return s;
}
function niceMax(m){if(m<=0)return 1;const p=Math.pow(10,Math.floor(Math.log10(m)));const r=m/p;return (r<=1?1:r<=2?2:r<=5?5:10)*p;}
function barChart(title,days,val,fmtv,axis){
  const W=340,H=150,L=34,B=22,T=8,N=days.length,vals=days.map(val),max=niceMax(Math.max(...vals));
  const step=(W-L-4)/N,bw=Math.max(3,step*0.62),ph=H-B-T,y=v=>T+ph-(v/max)*ph;
  let s='<svg viewBox="0 0 '+W+" "+H+'" role="img" aria-label="'+title+'">';
  [0,max/2,max].forEach(g=>{s+='<line x1="'+L+'" x2="'+W+'" y1="'+y(g)+'" y2="'+y(g)+'" stroke="var(--line)" stroke-width="1"/><text x="'+(L-6)+'" y="'+(y(g)+3.5)+'" text-anchor="end" fill="var(--muted)" font-size="10">'+axis(g)+"</text>";});
  const every=Math.ceil(N/6);
  days.forEach((d,i)=>{
    const v=vals[i],x=L+i*step+(step-bw)/2,top=y(v),hh=T+ph-top,r=Math.min(4,bw/2,hh);
    s+='<g class="col" data-i="'+i+'"><rect x="'+(L+i*step)+'" y="'+T+'" width="'+step+'" height="'+(ph+B)+'" fill="transparent"/>';
    if(v>0)s+='<path class="bar" d="M'+x+" "+(T+ph)+"V"+(top+r)+"Q"+x+" "+top+" "+(x+r)+" "+top+"H"+(x+bw-r)+"Q"+(x+bw)+" "+top+" "+(x+bw)+" "+(top+r)+"V"+(T+ph)+'Z"/>';
    s+="</g>";
    if(i%every===0||i===N-1)s+='<text x="'+(L+i*step+step/2)+'" y="'+(H-6)+'" text-anchor="middle" fill="var(--muted)" font-size="10">'+(d.d.getMonth()+1)+"/"+d.d.getDate()+"</text>";
  });
  s+="</svg>";
  return {html:'<div class="chart"><h3></h3><div class="ro"></div>'+s+"</div>",title,vals,fmtv};
}
function renderTrends(){
  document.querySelectorAll("#ranges button").forEach(b=>b.setAttribute("aria-pressed",+b.dataset.r===trRange));
  const host=$("trendsBody");const base=pdate(cycleToday());const days=[];
  for(let k=trRange-1;k>=0;k--){const d=new Date(base);d.setDate(d.getDate()-k);const ds=dstr(d);days.push({ds,d,s:dayStats(trendDocs[ds]||[])});}
  const any=days.filter(x=>x.s.any);
  if(!any.length){host.innerHTML='<p class="hint">No entries in this range yet. Log bottles, diapers, naps and night sleep on the Log tab and your trends will show up here.</p>';return;}
  // today is still in progress, so it only counts toward the averages when no full day is logged yet
  const one=trRange===1,full=any.filter(x=>x.ds!==cycleToday()),logged=one||!full.length?any:full;
  const n=logged.length,sum=f=>logged.reduce((a,x)=>a+f(x.s),0),bt=sum(s=>s.bottles),oz=sum(s=>s.oz);
  const r1=v=>Math.round(v*10)/10;
  const pd=one?" today":" per day";
  const tiles=[["Ounces"+pd,r1(oz/n)+" oz",bt?r1(bt/n)+" bottles · "+r1(oz/bt)+" oz each":"No bottles logged"],
    ["Nap time"+pd,dur(sum(s=>s.nap)/n)],["Night sleep",dur(sum(s=>s.night)/n)],["Diapers"+pd,(sum(s=>s.diapers)/n).toFixed(1),(sum(s=>s.wet)/n).toFixed(1)+" wet · "+(sum(s=>s.dirty)/n).toFixed(1)+" dirty"]];
  const hrs=v=>(Math.round(v*10)/10)+"h";
  const charts=[barChart("Ounces per day",days,x=>x.s.oz,v=>v+" oz",v=>Math.round(v)),
    barChart("Nap time per day",days,x=>x.s.nap/60,v=>dur(v*60),hrs),
    barChart("Night sleep",days,x=>x.s.night/60,v=>dur(v*60),hrs),
    barChart("Diapers per day",days,x=>x.s.diapers,v=>v+" diaper"+(v===1?"":"s"),v=>Math.round(v))];
  host.innerHTML='<div class="tiles">'+
    tiles.map(t=>'<div class="tile"><small>'+t[0]+"</small><b>"+t[1]+"</b>"+(t[2]?"<i>"+t[2]+"</i>":"")+"</div>").join("")+"</div>"+(one?"":charts.map(c=>c.html).join(""));
  if(one)return;
  host.querySelectorAll(".chart").forEach((el,ci)=>{
    const c=charts[ci];el.querySelector("h3").textContent=c.title;const ro=el.querySelector(".ro");
    const show=i=>{const d=days[i];ro.textContent=(i===days.length-1?"Today":d.d.toLocaleDateString(undefined,{month:"short",day:"numeric"}))+": "+c.fmtv(Math.round(c.vals[i]*100)/100);
      el.querySelectorAll(".bar").forEach(b=>b.classList.remove("sel"));const bar=el.querySelector('.col[data-i="'+i+'"] .bar');if(bar)bar.classList.add("sel");};
    el.querySelectorAll(".col").forEach(g=>{const i=+g.dataset.i;g.addEventListener("pointerenter",()=>show(i));g.addEventListener("click",()=>show(i));});
    show(days.length-1);
  });
}
document.querySelectorAll("#ranges button").forEach(b=>b.onclick=()=>{trRange=+b.dataset.r;renderTrends();});

const VIEWS={day:["dayView","tabDay"],log:["logView","tabLog"],trends:["trendsView","tabTrends"],edit:["editView","tabEdit"]};
function showTab(w){Object.entries(VIEWS).forEach(([k,[v,t]])=>{$(v).hidden=k!==w;$(t).setAttribute("aria-selected",k===w);});$("days").hidden=!(w==="day"||w==="log");if(w==="day"){wantScroll=true;render();}else if(w==="log"){renderDays();renderLog();}else if(w==="trends")renderTrends();else renderEdit();}
Object.entries(VIEWS).forEach(([k,[v,t]])=>{$(t).onclick=()=>showTab(k);});
let curToday=null;
setInterval(()=>{if($("sheetHost").innerHTML)return;const t=cycleToday();if(curToday==null)curToday=t;if(t!==curToday){const was=curToday;curToday=t;if(selDate===was){selDate=t;loadDay();loadEvents();return;}renderDays();}if(!$("dayView").hidden)render();if(!$("logView").hidden)renderLog();},60000);
let booted=false;
function gate(show,msg){$("gate").hidden=!show;$("app").hidden=show;if(msg!=null)$("gErr").textContent=msg;}
window.__noAccess=()=>{gate(true,"This account doesn't have access to Leona's Day. Sign in with one of the two approved accounts.");signOut(auth);};
$("gForm").addEventListener("submit",ev=>{ev.preventDefault();$("gErr").textContent="";$("gBtn").disabled=true;
  signInWithEmailAndPassword(auth,$("gEmail").value.trim(),$("gPass").value).catch(err=>{$("gErr").textContent=/invalid|wrong|not-found|user/.test(err.code||"")?"That email and password don't match. Try again.":"Couldn't sign in. Check your connection and try again.";}).finally(()=>{$("gBtn").disabled=false;});});
onAuthStateChanged(auth,user=>{if(user){gate(false);if(!booted){booted=true;boot();}}else gate(true);});
})();
</script>
